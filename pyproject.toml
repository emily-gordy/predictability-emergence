[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "predictability-emergence"
version = "0.1.0"
description = "Tools for predictability & emergence modeling"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"  # SPDX license string
authors = [{ name = "Emily Gordy" }]
keywords = ["predictability", "emergence", "ml", "science"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.24",
  "xarray",
  "xesmf",
  "dask",
  "netCDF4",
  "bottleneck",
]

[project.urls]
Homepage = "https://github.com/emily-gordy/predictability-emergence"

[tool.setuptools]
packages = ["predictability_emergence"]

[project.scripts]
evalnn = "predictability_emergence.evalnn:main"
trainnn = "predictability_emergence.trainnn:main"